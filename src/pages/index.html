<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@700&family=Roboto+Slab:wght@400;700&family=Space+Mono:wght@400;700&display=swap"
    />

    <title>Frontend Mentor | Pomodoro app</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/main.js" defer></script>
  </head>

  <body class="c-app">
    <main class="c-app__main">
      <h1 class="c-app__title">pomodoro</h1>

      <fieldset class="c-mode-switch">
        <legend class="u-sr-only">Timer mode</legend>
        <button
          class="c-mode-switch__option is-active js-mode"
          type="button"
          data-mode="pomodoro"
          aria-pressed="true"
        >
          <span class="c-mode-switch__label">pomodoro</span>
        </button>
        <button
          class="c-mode-switch__option js-mode"
          type="button"
          data-mode="short"
          aria-pressed="false"
        >
          <span class="c-mode-switch__label">short break</span>
        </button>
        <button
          class="c-mode-switch__option js-mode"
          type="button"
          data-mode="long"
          aria-pressed="false"
        >
          <span class="c-mode-switch__label">long break</span>
        </button>
      </fieldset>

      <section class="c-timer" aria-label="Timer">
        <div class="c-timer__face">
          <svg
            class="c-timer__progress"
            viewBox="0 0 366 366"
            aria-hidden="true"
            focusable="false"
          >
            <circle
              class="c-timer__bar js-timer-bar"
              cx="183"
              cy="183"
              r="164"
              pathLength="100"
            />
          </svg>
          <div class="c-timer__content">
            <p class="c-timer__time js-timer-time" role="timer">25:00</p>
            <button class="c-timer__action js-timer-action" type="button">
              start
            </button>
          </div>
        </div>
      </section>

      <p class="u-sr-only js-timer-status" role="status"></p>

      <button
        class="c-app__settings-button js-settings-open"
        type="button"
        aria-haspopup="dialog"
        aria-controls="settings"
      >
        <span class="c-app__settings-icon" aria-hidden="true"></span>
        <span class="u-sr-only">Settings</span>
      </button>
    </main>

    <dialog class="c-settings" id="settings" aria-labelledby="settings-title">
      <form
        class="c-settings__panel js-settings-form"
        method="dialog"
        novalidate
      >
        <header class="c-settings__header">
          <h2 class="c-settings__title" id="settings-title">Settings</h2>
          <button
            class="c-settings__close js-settings-close"
            type="button"
            aria-label="Close settings"
          >
            <span class="c-settings__close-icon" aria-hidden="true"></span>
          </button>
        </header>

        <div class="c-settings__body">
          <div
            class="c-settings__group c-settings__group--time"
            role="group"
            aria-labelledby="settings-time"
          >
            <h3 class="c-settings__heading" id="settings-time">Time (minutes)</h3>
            <div class="c-settings__times">
              <div class="c-time-field">
                <label class="c-time-field__label" for="time-pomodoro"
                  >pomodoro</label
                >
                <div class="c-time-field__control">
                  <input
                    class="c-time-field__input js-time-input"
                    id="time-pomodoro"
                    name="pomodoro"
                    type="number"
                    inputmode="numeric"
                    min="1"
                    max="99"
                    step="1"
                    value="25"
                    required

                    aria-describedby="time-hint"
                  />
                  <div class="c-time-field__steppers">
                    <button
                      class="c-time-field__stepper js-time-step"
                      type="button"
                      tabindex="-1"
                      data-step="1"
                      aria-label="Increase pomodoro minutes"
                    >
                      <span
                        class="c-time-field__arrow c-time-field__arrow--up"
                        aria-hidden="true"
                      ></span>
                    </button>
                    <button
                      class="c-time-field__stepper js-time-step"
                      type="button"
                      tabindex="-1"
                      data-step="-1"
                      aria-label="Decrease pomodoro minutes"
                    >
                      <span
                        class="c-time-field__arrow c-time-field__arrow--down"
                        aria-hidden="true"
                      ></span>
                    </button>
                  </div>
                </div>
              </div>

              <div class="c-time-field">
                <label class="c-time-field__label" for="time-short"
                  >short break</label
                >
                <div class="c-time-field__control">
                  <input
                    class="c-time-field__input js-time-input"
                    id="time-short"
                    name="short"
                    type="number"
                    inputmode="numeric"
                    min="1"
                    max="99"
                    step="1"
                    value="5"
                    required

                    aria-describedby="time-hint"
                  />
                  <div class="c-time-field__steppers">
                    <button
                      class="c-time-field__stepper js-time-step"
                      type="button"
                      tabindex="-1"
                      data-step="1"
                      aria-label="Increase short break minutes"
                    >
                      <span
                        class="c-time-field__arrow c-time-field__arrow--up"
                        aria-hidden="true"
                      ></span>
                    </button>
                    <button
                      class="c-time-field__stepper js-time-step"
                      type="button"
                      tabindex="-1"
                      data-step="-1"
                      aria-label="Decrease short break minutes"
                    >
                      <span
                        class="c-time-field__arrow c-time-field__arrow--down"
                        aria-hidden="true"
                      ></span>
                    </button>
                  </div>
                </div>
              </div>

              <div class="c-time-field">
                <label class="c-time-field__label" for="time-long"
                  >long break</label
                >
                <div class="c-time-field__control">
                  <input
                    class="c-time-field__input js-time-input"
                    id="time-long"
                    name="long"
                    type="number"
                    inputmode="numeric"
                    min="1"
                    max="99"
                    step="1"
                    value="15"
                    required

                    aria-describedby="time-hint"
                  />
                  <div class="c-time-field__steppers">
                    <button
                      class="c-time-field__stepper js-time-step"
                      type="button"
                      tabindex="-1"
                      data-step="1"
                      aria-label="Increase long break minutes"
                    >
                      <span
                        class="c-time-field__arrow c-time-field__arrow--up"
                        aria-hidden="true"
                      ></span>
                    </button>
                    <button
                      class="c-time-field__stepper js-time-step"
                      type="button"
                      tabindex="-1"
                      data-step="-1"
                      aria-label="Decrease long break minutes"
                    >
                      <span
                        class="c-time-field__arrow c-time-field__arrow--down"
                        aria-hidden="true"
                      ></span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <p class="c-settings__hint" id="time-hint">1 to 99 minutes</p>
            <p
              class="c-settings__error js-time-error"
              id="time-error"
              role="alert"
            ></p>
          </div>

          <div
            class="c-settings__group c-settings__group--row"
            role="radiogroup"
            aria-labelledby="settings-font"
          >
            <h3 class="c-settings__heading" id="settings-font">Font</h3>
            <div class="c-settings__options">
              <label class="c-swatch c-swatch--font c-swatch--kumbh">
                <input
                  class="c-swatch__input u-sr-only"
                  type="radio"
                  name="font"
                  value="kumbh"
                  checked
                />
                <span class="c-swatch__mark" aria-hidden="true">Aa</span>
                <span class="u-sr-only">Kumbh Sans</span>
              </label>
              <label class="c-swatch c-swatch--font c-swatch--roboto">
                <input
                  class="c-swatch__input u-sr-only"
                  type="radio"
                  name="font"
                  value="roboto"
                />
                <span class="c-swatch__mark" aria-hidden="true">Aa</span>
                <span class="u-sr-only">Roboto Slab</span>
              </label>
              <label class="c-swatch c-swatch--font c-swatch--space">
                <input
                  class="c-swatch__input u-sr-only"
                  type="radio"
                  name="font"
                  value="space"
                />
                <span class="c-swatch__mark" aria-hidden="true">Aa</span>
                <span class="u-sr-only">Space Mono</span>
              </label>
            </div>
          </div>

          <div
            class="c-settings__group c-settings__group--row"
            role="radiogroup"
            aria-labelledby="settings-color"
          >
            <h3 class="c-settings__heading" id="settings-color">Color</h3>
            <div class="c-settings__options">
              <label class="c-swatch c-swatch--color c-swatch--red">
                <input
                  class="c-swatch__input u-sr-only"
                  type="radio"
                  name="color"
                  value="red"
                  checked
                />
                <span class="c-swatch__mark" aria-hidden="true"></span>
                <span class="u-sr-only">Red</span>
              </label>
              <label class="c-swatch c-swatch--color c-swatch--cyan">
                <input
                  class="c-swatch__input u-sr-only"
                  type="radio"
                  name="color"
                  value="cyan"
                />
                <span class="c-swatch__mark" aria-hidden="true"></span>
                <span class="u-sr-only">Cyan</span>
              </label>
              <label class="c-swatch c-swatch--color c-swatch--purple">
                <input
                  class="c-swatch__input u-sr-only"
                  type="radio"
                  name="color"
                  value="purple"
                />
                <span class="c-swatch__mark" aria-hidden="true"></span>
                <span class="u-sr-only">Purple</span>
              </label>
            </div>
          </div>
        </div>

        <button class="c-button c-settings__apply" type="submit">Apply</button>
      </form>
    </dialog>
  </body>
</html>
